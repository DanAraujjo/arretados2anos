# App Next.js em /web
#
# Painel: Base = web | Build = (do toml) | Publish = .next
#
[build]
  base = "web"
  # Remove álbum local do build (CDN via NEXT_PUBLIC_PHOTOS_BASE_URL)
  # Mantém manifest.json + faces.bin (índice rápido do scan)
  command = "find public/photos -type f ! -name 'manifest.json' ! -name 'faces.bin' -delete 2>/dev/null; npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"
