# App Next.js em /web
#
# Painel: Base = web | Build = npm run build | Publish = .next
# (Publish NÃO pode ser "web" nem vazio quando a UI força publish=web)
#
[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"
